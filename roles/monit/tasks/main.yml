- name: Require an explicit Monit HTTP password
  ansible.builtin.assert:
    that:
      - monit_password is string
      - monit_password | trim | length > 0
      - monit_password is not search('["\\x5c\\r\\n]')
    fail_msg: Set vault_monit_password with Ansible Vault before configuring Monit.
  no_log: true

- name: Install monit
  apt:
    name: monit
    state: present
    update_cache: yes

- name: Configure monit httpd
  copy:
    dest: /etc/monit/conf-enabled/httpd
    owner: root
    group: root
    mode: '0600'
    content: |
      set httpd port {{ monit_port }} and
      use address {{ monit_bind_address }}
      allow {{ monit_user }}:"{{ monit_password }}"

  no_log: true
  diff: false
  notify: Restart monit

- name: Validate monit config
  command: monit -t
  changed_when: false

- name: Ensure monit is running and enabled
  systemd:
    name: monit
    enabled: true
    state: started

- name: Conditionally allow Monit port in UFW
  ufw:
    rule: "{{ 'allow' if monit_public else 'deny' }}"
    port: "{{ monit_port }}"
    proto: tcp
  when: monit_bind_address in ['0.0.0.0', '::', '127.0.0.1']
